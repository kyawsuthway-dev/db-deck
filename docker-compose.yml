name: db-deck

services:
  # Builds the extension. Node.js and npm live here, not on your machine.
  # Runs as your WSL user (UID/GID from .env, default 1000) so node_modules/ and dist/ aren't owned by root.
  node:
    image: node:22
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    environment:
      # Any uid works: npm needs a writable home for its cache, and the image only has one for uid 1000.
      HOME: /tmp
    volumes:
      - .:/app
    command: sh -c "npm install && npm run watch"

  # Test databases. Your extension connects to them at localhost.
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sample
    ports:
      - "5432:5432"
    volumes:
      - ./docker/seed/postgres.sql:/docker-entrypoint-initdb.d/seed.sql:ro
      - pgdata:/var/lib/postgresql/data

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: sample
    ports:
      - "3306:3306"
    volumes:
      - ./docker/seed/mysql.sql:/docker-entrypoint-initdb.d/seed.sql:ro
      - mysqldata:/var/lib/mysql

  # SQL Server (Developer edition, free for development and testing). Opt-in: it needs about 2 GB of RAM and an
  # x86-64 machine, so it starts only with `task up:sqlserver` (compose profile "sqlserver"). Log in as sa.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["sqlserver"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: DbDeck-sa-2026
    ports:
      - "1433:1433"
    command: ["bash", "/init.sh"]
    volumes:
      - ./docker/sqlserver/init.sh:/init.sh:ro
      - ./docker/seed/sqlserver.sql:/seed/sqlserver.sql:ro
      - mssqldata:/var/opt/mssql

  # Oracle Database 23ai Free (gvenzl/oracle-free, free for development and testing). Opt-in: about 2.5 GB of RAM
  # and a 6.5 GB image, so it starts only with `task up:oracle` (compose profile "oracle"). Service FREEPDB1, user
  # sample/sample (the seed's tables), or system with ORACLE_PASSWORD.
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    profiles: ["oracle"]
    environment:
      ORACLE_PASSWORD: DbDeck-ora-2026
      APP_USER: sample
      APP_USER_PASSWORD: sample
    ports:
      - "1521:1521"
    volumes:
      - ./docker/seed/oracle.sql:/container-entrypoint-initdb.d/seed.sql:ro
      - oradata:/opt/oracle/oradata

  # Test SSH server, for the SSH tunnel. Log in as dbdeck/dbdeck at localhost:2222;
  # through it, the databases are postgres:5432, mysql:3306, sqlserver:1433 and oracle:1521.
  sshd:
    build: ./docker/sshd
    ports:
      - "2222:22"

volumes:
  pgdata:
  mysqldata:
  mssqldata:
  oradata:
