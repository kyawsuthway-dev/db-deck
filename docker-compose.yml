name: db-deck

services:
  # Builds the extension. Node.js and npm live here, not on your machine.
  # Runs as your WSL user (UID/GID from .env, default 1000) so node_modules/ and dist/ aren't owned by root.
  node:
    image: node:22
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    environment:
      # Any uid works: npm needs a writable home for its cache, and the image only has one for uid 1000.
      HOME: /tmp
    volumes:
      - .:/app
    command: sh -c "npm install && npm run watch"

  # Test databases. Your extension connects to them at localhost.
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sample
    ports:
      - "5432:5432"
    volumes:
      - ./docker/seed/postgres.sql:/docker-entrypoint-initdb.d/seed.sql:ro
      - pgdata:/var/lib/postgresql/data

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: sample
    ports:
      - "3306:3306"
    volumes:
      - ./docker/seed/mysql.sql:/docker-entrypoint-initdb.d/seed.sql:ro
      - mysqldata:/var/lib/mysql

volumes:
  pgdata:
  mysqldata:
